<!doctype html>
<html lang="tr" data-tema="koyu">
<head>
<meta charset="utf-8">
<title>Hayal Medya Vesikalık Pro</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="ust">
    <div class="marka">
      <img src="assets/app_icon.png" alt="" class="simge">
      <div><div class="marka-ad">HAYAL MEDYA</div><div class="marka-alt">Vesikalık Pro <b id="surum">1.4.2</b></div></div>
    </div>
    <nav class="adimlar" id="adimlar" aria-label="Adımlar"></nav>
    <div class="ust-sag">
      <button class="ikon" id="btnGeriAl" title="Geri al (Ctrl+Z)" aria-label="Geri al"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <span class="ayrac"></span>
      <button class="ikon" id="btnArsiv" title="Arşiv ve günlük rapor (F3)" aria-label="Arşiv"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg></button>
      <button class="ikon" id="btnAyar" title="Ayarlar (F2)" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
      <button class="ikon" id="btnKisayol" title="Kısayol rehberi (F1)" aria-label="Kısayollar"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
      <button class="ikon" id="btnTema" title="Koyu / açık tema" aria-label="Tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button class="ikon" id="btnHakkinda" title="Hakkında" aria-label="Hakkında"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
  </header>

  <div class="govde">
    <aside class="sira">
      <div class="sira-bas"><span>SIRA <b id="siraSay">0</b></span>
        <button class="ikon kucuk" id="btnEkle" title="Fotoğraf ekle (Ctrl+O)" aria-label="Fotoğraf ekle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div id="siraListe" class="sira-liste"></div>
      <div class="kamera" id="kameraDurum" title="Ayarlar'dan kamera klasörü seçilir"><span class="nokta"></span><span id="kameraYazi">Kamera klasörü kapalı</span></div>
    </aside>

    <main id="sahne" class="sahne"></main>

    <aside class="panel" id="panel"></aside>
  </div>

  <footer class="alt">
    <div class="alt-bilgi"><span id="donanim">Donanım: —</span><span id="dosyaBilgi"></span></div>
    <button class="btn" id="btnGeri">Geri</button>
    <button class="btn ana" id="btnIleri">İleri</button>
  </footer>
</div>

<div id="ilerleme" class="ortu gizli" role="dialog" aria-label="İşlem sürüyor">
  <div class="ilerleme-kutu">
    <div class="donen"></div>
    <div class="ilerleme-mesaj" id="ilMesaj">Çalışıyor…</div>
    <div class="cubuk"><i id="ilCubuk"></i></div>
    <div class="ilerleme-alt"><span id="ilYuzde">%0</span><span id="ilKalan"></span></div>
    <div class="kucuk-not">Program çalışıyor, lütfen bekleyin. En kaliteli sonuç için bu işlem biraz sürebilir.</div>
  </div>
</div>
<div id="modal" class="ortu gizli" role="dialog"><div class="modal-kutu" id="modalKutu"></div></div>
<div id="bildirim" class="bildirim gizli"></div>
<script src="app.js"></script>
<script src="manuel.js"></script>
<script src="moduller.js"></script>
</body>
</html>
